/* Footer Styling */
.dropdown-content {
           display: none;
           position: absolute;
           background-color: #444;
           min-width: 200px;
           left: 0;
           box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
           padding: 10px;
       }
       .dropdown ul{
           list-style: none;

       }      
        .dropdown-content li {
           width: 100%;
           position: relative;
       }

        .dropdown-content a {
           padding: 10px;
           display: block;
           color: white;
       }

       .dropdown-content a:hover {
           background-color: #555;
       }

    </style>
 </head>
<body>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const dropdown = document.querySelector(".dropdown");
            const dropdownContent = document.querySelector(".dropdown-content");
 
            dropdown.addEventListener("click", function (event) {
                event.stopPropagation();
                dropdownContent.style.display = dropdownContent.style.display === "block" ? "none" : "block";
            });
 
        
            document.querySelectorAll(".nested-dropbtn").forEach(button => {
                button.addEventListener("click", function (event) {
                    event.stopPropagation();
                    this.parentElement.classList.toggle("open");
                });
            });
 
            
            const secondNestedDropdown = document.querySelector(".second-nested-dropdown");
            const secondNestedDropbtn = document.querySelector(".second-nested-dropbtn");
 
            secondNestedDropbtn.addEventListener("click", function (event) {
                event.stopPropagation();
                secondNestedDropdown.classList.toggle("open");
            });
 
            document.addEventListener("click", function () {
                dropdownContent.style.display = "none";
                document.querySelectorAll(".nested-dropdown").forEach(el => el.classList.remove("open"));
                document.querySelector(".second-nested-dropdown").classList.remove("open");
            });
        });
    </script>
